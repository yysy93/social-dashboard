<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소셜링 인기페이지 대시보드</title>
<meta name="description" content="킼킼킼 · 굽굽매거진 콘텐츠, 팔로워, 광고 문의, 매출 대시보드">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232a78d6'/><rect x='22' y='52' width='14' height='26' rx='4' fill='white'/><rect x='43' y='36' width='14' height='42' rx='4' fill='white'/><rect x='64' y='22' width='14' height='56' rx='4' fill='white'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="overview">
<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1 id="title">소셜링 인기페이지 대시보드</h1>
      <p class="sub"><span id="status" class="status">데이터 불러오는 중…</span></p>
    </div>
    <div class="controls">
      <label class="sr-only" for="period">기간</label>
      <select id="period"><option value="all">26년 전체</option></select>
      <button id="refresh" class="btn" type="button">↻ 새로고침</button>
    </div>
  </div>
  <nav class="wrap tabs" id="view-tabs" aria-label="보기 선택">
    <a href="#overview" data-view="overview">한눈에 보기</a>
    <a href="#followers" data-view="followers">팔로워</a>
    <a href="#revenue" data-view="revenue">매출</a>
    <a href="#kikiki" data-view="kikiki"><i class="dot kikiki"></i>킼킼킼</a>
    <a href="#gugu" data-view="gugu"><i class="dot gugu"></i>굽굽매거진</a>
  </nav>
</header>

<main class="wrap">
  <div id="errors"></div>

  <!-- ① 팔로워 비교 -->
  <section class="section" data-section="followers" aria-labelledby="h-followers">
    <div class="section-head"><h2 id="h-followers">팔로워 비교</h2><span class="hint" id="followers-range"></span></div>
    <div class="grid follower-grid">
      <div class="card stack" id="follower-cards"></div>
      <div class="card">
        <div class="card-head"><h3>첫 기록일 대비 증감률</h3><div class="legend" id="follower-legend"></div></div>
        <div class="chart h-260"><canvas id="followerChart" aria-label="채널별 팔로워 증감률 추이"></canvas></div>
      </div>
    </div>
  </section>

  <!-- ② 매출 -->
  <section class="section" data-section="revenue" aria-labelledby="h-revenue">
    <div class="section-head"><h2 id="h-revenue">매출 핵심 지표</h2><span class="hint" id="revenue-check"></span></div>
    <div class="grid kpi-grid" id="revenue-cards"></div>
    <div class="grid two" id="revenue-charts">
      <div class="card">
        <div class="card-head"><h3>월별 매출</h3><div class="legend" id="revenue-legend"></div></div>
        <div class="chart h-260"><canvas id="revenueChart" aria-label="채널별 월별 매출"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>누적 매출</h3></div>
        <div class="chart h-260"><canvas id="cumulativeChart" aria-label="누적 매출"></canvas></div>
      </div>
    </div>
    <div class="card empty" id="revenue-empty" hidden>
      <strong>월별 매출표 2026에 아직 입력된 금액이 없어요.</strong>
      <p>시트의 <b>전체매출 · 조회수 수익($) · 광고수익</b> 칸에 숫자를 입력하면 새로고침할 때 카드와 차트가 자동으로 채워져요.</p>
    </div>
  </section>

  <!-- ③④ 채널별 -->
  <section class="section" data-section="channels" aria-labelledby="h-channels">
    <div class="section-head">
      <h2 id="h-channels">채널별 콘텐츠 요약</h2>
      <div class="seg" role="tablist" id="channel-tabs"></div>
    </div>
    <div class="channels" id="channels" data-active="kikiki"></div>
  </section>

  <!-- 검증 -->
  <section class="section" data-section="verify">
    <details class="card verify">
      <summary><h2>데이터 검증 결과</h2><span class="hint">시트의 월 합계와 게시물별 직접 계산값 비교</span></summary>
      <div id="verify"></div>
    </details>
  </section>
</main>

<footer class="wrap foot">원본: Google Sheets · 페이지를 열거나 새로고침할 때마다 최신 데이터를 불러옵니다.</footer>

<template id="tpl-channel">
  <article class="channel" role="tabpanel">
    <div class="channel-title"><span class="dot"></span><h3 class="ch-name"></h3><span class="hint ch-period"></span></div>
    <div class="grid kpi-grid small ch-kpis"></div>
    <div class="card top-card">
      <div class="badge-row"><span class="pill">🏆 조회수 1위</span><span class="hint top-meta"></span></div>
      <h4 class="top-title"></h4>
      <div class="top-stats"></div>
      <ul class="insights"></ul>
      <a class="btn link top-link" target="_blank" rel="noopener">콘텐츠 바로가기 ↗</a>
    </div>
    <div class="card"><div class="card-head"><h3>월별 조회수</h3></div><div class="chart h-200"><canvas class="ch-month"></canvas></div></div>
    <div class="card"><div class="card-head"><h3>포맷별 평균 조회수</h3></div><div class="chart h-160"><canvas class="ch-format"></canvas></div></div>
    <div class="card">
      <div class="card-head"><h3 class="top-n-title">조회수 TOP 5</h3></div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>#</th><th>콘텐츠</th><th class="num">조회수</th><th class="num">공유</th></tr></thead><tbody class="ch-top"></tbody></table></div>
    </div>
    <div class="card ads-card">
      <div class="card-head"><h3>광고 / 협찬 문의 현황</h3><span class="hint ch-ads-count"></span></div>
      <div class="ads"></div>
    </div>
  </article>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
